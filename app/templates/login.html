<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>StellarTrack</title></head><body class="login"><main><h1>StellarTrack</h1><p>Sign in to your work tracker</p><form id="login"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button>Sign in</button><p id="message" role="alert"></p></form></main><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))}),d=await r.json();if(r.ok)location=d.redirect;else document.querySelector('#message').textContent=d.detail||'Sign-in failed'}</script></body></html>
