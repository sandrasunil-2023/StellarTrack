<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>StellarTrack Admin</title></head><body class="admin-body"><aside><h1>StellarTrack</h1><p>{{ user.full_name }}</p><nav><button data-page="overview">Dashboard</button><button data-page="employees">Employees</button><button data-page="companies">Companies</button><button data-page="entries">All time entries</button><button data-page="reports">Reports</button><button data-page="audit">Change history</button><button data-page="profile">My profile</button></nav><button id="logout" class="secondary">Sign out</button></aside><main class="admin-main"><div id="flash"></div><section id="overview" class="page"><h2>Dashboard</h2><div id="cards" class="cards"></div><article class="panel"><h3>Recent activity</h3><div id="recent"></div></article></section><section id="employees" class="page hidden"><h2>Employees</h2><article class="panel"><form id="employee-form" class="filter"><input type="hidden" name="id"><label>Name<input name="full_name" required></label><label>Username<input name="username" required></label><label>Password<input type="password" name="initial_password" minlength="8" required></label><label>Role<select name="role"><option>EMPLOYEE</option><option>ADMIN</option></select></label><label class="check"><input type="checkbox" name="is_active" checked>Active</label><button>Save</button><button type="button" data-cancel="employee" class="secondary">Cancel</button></form></article><article class="panel"><div id="employees-table"></div></article></section><section id="companies" class="page hidden"><h2>Companies</h2><article class="panel"><form id="company-form" class="filter"><input type="hidden" name="id"><label>Name<input name="name" required></label><label>Code<input name="code"></label><label class="check"><input type="checkbox" name="is_active" checked>Active</label><button>Save</button><button type="button" data-cancel="company" class="secondary">Cancel</button></form></article><article class="panel"><div id="companies-table"></div></article></section><section id="entries" class="page hidden"><h2>All time entries</h2><article class="panel"><form id="entry-filter" class="filter"><label>Employee<select name="employee_id" class="employees"><option value="">All</option></select></label><label>Company<select name="company_id" class="companies"><option value="">All</option></select></label><label>Start<input name="start" type="date"></label><label>End<input name="end" type="date"></label><button>Apply</button></form></article><article class="panel"><div id="entries-table"></div></article></section><section id="reports" class="page hidden"><h2>Reports</h2><article class="panel"><form id="report-filter" class="filter"><label>Employee<select name="employee_id" class="employees"><option value="">All</option></select></label><label>Company<select name="company_id" class="companies"><option value="">All</option></select></label><label>Start<input name="start" type="date"></label><label>End<input name="end" type="date"></label><label>Week<input name="week" type="date"></label><label>Month<input name="month" type="month"></label><button>Apply</button><a id="csv" class="button">Export CSV</a><a id="excel" class="button">Export Excel</a></form></article><div id="report-total" class="report-total"></div><article class="panel"><div id="report-detail"></div></article></section><section id="audit" class="page hidden"><h2>Change history</h2><article class="panel"><form id="audit-filter" class="filter"><label>Actor<select name="actor_id" class="employees"><option value="">All</option></select></label><label>Action<input name="action"></label><label>Entity<input name="entity_type"></label><button>Apply</button></form></article><article class="panel"><div id="audit-table"></div></article></section><section id="profile" class="page hidden"><h2>My profile</h2><article class="panel"><div id="profile-data"></div><form id="password-form"><label>Current password<input type="password" name="current_password" required></label><label>New password<input type="password" name="new_password" minlength="8" required></label><button>Update password</button></form></article></section></main><script>window.CSRF={{ csrf_token|tojson }};</script><script src="/static/admin.js"></script></body></html>
