<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>StellarTrack</title></head><body><header><strong>StellarTrack</strong><span>{{ user.full_name }} · {{ user.role.value }}</span><button id="out">Sign out</button></header><main class="app"><h1>Dashboard</h1><section id="cards" class="cards"></section>{% if user.role.value == 'EMPLOYEE' %}<section class="panel"><h2>Log hours</h2><form id="entry"><label>Company<select name="company_id" id="companies" required><option value="">Select a company</option></select></label><label>Date<input name="work_date" type="date" required></label><label>Hours<input name="hours" type="number" min="0.01" max="24" step="0.25" required></label><label>Description<textarea name="description" required></textarea></label><button>Save hours</button><p id="notice"></p></form></section><section class="panel"><h2>Recent work</h2><table><thead><tr><th>Date</th><th>Hours</th><th>Description</th></tr></thead><tbody id="recent"></tbody></table></section>{% else %}<section class="panel"><h2>Admin workspace</h2><p>Management, reports, and audit-history APIs are protected by your admin session.</p></section>{% endif %}</main><script>const csrf={{ csrf_token|tojson }},role={{ user.role.value|tojson }};const api=role==='ADMIN'?'/admin/dashboard':'/employee/dashboard';fetch(api).then(r=>r.json()).then(d=>{let stats=role==='ADMIN'?d.overall:d;for(let [k,v] of Object.entries(stats)){if(k==='recent')continue;document.querySelector('#cards').insertAdjacentHTML('beforeend',`<article><span>${k.replaceAll('_',' ')}</span><b>${v}</b></article>`)}if(d.recent)document.querySelector('#recent').innerHTML=d.recent.map(x=>`<tr><td>${x.work_date}</td><td>${x.hours}</td><td>${x.description}</td></tr>`).join('')});if(role==='EMPLOYEE')fetch('/employee/companies').then(r=>r.json()).then(xs=>document.querySelector('#companies').insertAdjacentHTML('beforeend',xs.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')));document.querySelector('#out').onclick=()=>fetch('/auth/logout',{method:'POST',headers:{'X-CSRF-Token':csrf}}).then(()=>location='/');let form=document.querySelector('#entry');if(form)form.onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(form));let r=await fetch('/employee/time-entries',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(v)});document.querySelector('#notice').textContent=r.ok?'Hours saved.':(await r.json()).detail||'Could not save.';if(r.ok)form.reset()}</script></body></html>
