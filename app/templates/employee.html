<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>StellarTrack</title></head><body class="admin-body"><aside><h1>StellarTrack</h1><p>{{ user.full_name }}</p><nav><button data-page="dashboard">Dashboard</button><button data-page="log">Log hours</button><button data-page="history">My work history</button><button data-page="profile">My profile</button></nav><button id="logout" class="secondary">Sign out</button></aside><main class="admin-main"><div id="flash"></div><section id="dashboard" class="page"><h2>My dashboard</h2><div id="cards" class="cards"></div><article class="panel"><h3>Recent work entries</h3><div id="recent"></div></article></section><section id="log" class="page hidden"><h2>Log hours</h2><article class="panel"><form id="entry-form"><label>Company<select name="company_id" id="entry-company" required><option value="">Select a company</option></select></label><label>Engagement<select name="engagement_id" id="entry-engagement"><option value="">No engagement</option></select></label><label>Date<input name="work_date" id="entry-date" type="date" required></label><label>Hours<input name="hours" type="number" min="0.000001" max="23.999999" step="any" required></label><label>Work description<textarea name="description" required></textarea></label><button>Save hours</button></form></article></section><section id="history" class="page hidden"><h2>My work history</h2><article class="panel"><form id="history-filter" class="filter"><label>Company<select name="company_id" id="history-company"><option value="">All companies</option></select></label><label>Start date<input name="start" type="date"></label><label>End date<input name="end" type="date"></label><label>Week<input name="week" type="date"></label><label>Month<input name="month" type="month"></label><button>Apply filters</button><button id="clear-history" type="button" class="secondary">Clear</button></form></article><div id="history-total" class="report-total"></div><article class="panel"><div id="history-table"></div></article></section><section id="profile" class="page hidden"><h2>My profile</h2><article class="panel"><div id="profile-data"></div><h3>Change password</h3><form id="password-form"><label>Current password<input type="password" name="current_password" required></label><label>New password<input type="password" name="new_password" minlength="8" required></label><button>Update password</button></form></article></section></main><script>window.CSRF={{csrf_token|tojson}};window.MUST_CHANGE={{user.must_change_password|tojson}};</script><script src="/static/employee.js"></script></body></html>
